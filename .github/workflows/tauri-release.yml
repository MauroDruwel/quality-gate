name: Tauri Multi-Platform Release (Quality Gate)

on:
  workflow_call:
    inputs:
      release-tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string
      package-manager:
        description: "Package manager: pnpm or npm"
        required: false
        default: "pnpm"
        type: string
      pnpm-version:
        description: "pnpm version to use"
        required: false
        default: "10"
        type: string
    secrets:
      GITHUB_TOKEN:
        required: true

jobs:
  build-and-release:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-arm64"
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: "windows-x64"
            os: windows-latest
            args: "--target x86_64-pc-windows-msvc"
          - platform: "linux-x64"
            os: ubuntu-latest
            args: "--target x86_64-unknown-linux-gnu"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies (Frontend)
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-arm64' && 'aarch64-apple-darwin' || matrix.platform == 'windows-x64' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build and Upload Tauri Artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.release-tag }}
          releaseName: "Release ${{ inputs.release-tag }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
