name: Tauri CI (Quality Gate)

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        default: "20"
        type: string
      package-manager:
        description: "Package manager: pnpm or npm"
        required: false
        default: "pnpm"
        type: string
      pnpm-version:
        description: "pnpm version to use"
        required: false
        default: "10"
        type: string
      run-playwright:
        description: "Install Chromium and require the caller's test:e2e script to pass"
        default: false
        type: boolean

jobs:
  check-frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PACKAGE_MANAGER: ${{ inputs.package-manager }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm) pnpm install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager: $PACKAGE_MANAGER" >&2; exit 1 ;;
          esac

      - name: Check version consistency
        run: '"$PACKAGE_MANAGER" run --if-present check:versions'

      - name: Typecheck
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.typecheck ? 0 : 1)'; then
            "$PACKAGE_MANAGER" run typecheck
          else
            "$PACKAGE_MANAGER" exec -- tsc --noEmit
          fi

      - name: Lint
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.lint ? 0 : 1)'; then
            "$PACKAGE_MANAGER" run lint
          elif [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            pnpm exec eslint .
          else
            echo "No lint script configured"
          fi

      - name: Unit Tests
        run: '"$PACKAGE_MANAGER" run --if-present test'

      - name: Build frontend
        run: '"$PACKAGE_MANAGER" run --if-present build'

      - name: Install Playwright Chromium
        if: inputs.run-playwright
        run: |
          node -e 'if (!require("./package.json").scripts?.["test:e2e"]) throw Error("run-playwright requires a test:e2e script")'
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run Playwright tests
        if: inputs.run-playwright
        run: '"$PACKAGE_MANAGER" run test:e2e'

  check-rust:
    name: Rust Core Check & Test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Format check
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Cargo Check
        run: cargo check --all-targets
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Cargo Test
        run: cargo test
        working-directory: src-tauri
