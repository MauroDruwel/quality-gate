name: Python CI (Quality Gate)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Single Python version to test (e.g. '3.12')"
        required: false
        type: string
      python-versions:
        description: "JSON array of Python versions"
        required: false
        type: string
      run-tests:
        description: "Run pytest test suite"
        required: false
        default: true
        type: boolean
      run-lint:
        description: "Run ruff linting"
        required: false
        default: true
        type: boolean
      run-format:
        description: "Run ruff format check"
        required: false
        default: true
        type: boolean
      strict:
        description: "Enforce strict zero-warning policy"
        required: false
        default: true
        type: boolean

jobs:
  lint-and-test:
    name: Python ${{ matrix.python-version }} Check & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ inputs.python-versions != '' && fromJson(inputs.python-versions) || (inputs.python-version != '' && fromJson(format('["{0}"]', inputs.python-version)) || fromJson('["3.11", "3.12", "3.13"]')) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Ruff Lint
        if: ${{ inputs.run-lint }}
        run: ruff check .

      - name: Ruff Format Check
        if: ${{ inputs.run-format }}
        run: ruff format --check .

      - name: Run Tests
        if: ${{ inputs.run-tests }}
        run: pytest
